name: ci

on:
  push:
  pull_request:

jobs:
  demo:
    name: compile + demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q skill_to_code demo
      - name: Run end-to-end demo
        run: python demo/run_demo.py
